<!DOCTYPE html>

<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../Script/main.js" defer></script>
    <script src="../Script/tickets.js" defer></script>
    <link rel="stylesheet" href="../CSS/pages/tickets.css">
    <title> CARPE DIEM | Tickets</title>
</head>

<body class="flex flex-col bg-linear-to-br from-gray-900 to-black text-white overflow-x-hidden background-no-repeat bg-cover bg-center">

    <!-- Blurred background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <img src="../assets/tickets/ticketsbg.png" alt="" class="w-full h-full object-cover blur-sm scale-110">
        <div class="absolute inset-0 bg-black/50"></div>
    </div>

    <header class="fixed top-0 w-full z-50 px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 backdrop-blur-lg bg-olive-900/30">

        <nav class="grid grid-cols-3 items-center font-instrument-sans text-neutral-100 py-3">

            <!-- Left -->
            <div class="flex justify-around">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>

            <!-- Center -->
            <a href="index.html" class="justify-self-center" id="brand">
                <div class="flex flex-col items-center">
                    <p class="bg-red-400">VIM</p>
                    <p class="serif text-3xl">
                        CARPE DIEM
                    </p>
                </div>
            </a>

            <!-- Right -->
            <div class="flex justify-around">
                <div class="relative" id="exploreMenu">
                    <button
                        id="exploreBtn"
                        class="flex items-center gap-1 cursor-pointer"
                    >
                        Explore
                        <span id="exploreArrow">▾</span>
                    </button>
                    <div
                        id="exploreDropdown"
                        class="absolute top-full left-1/2 -translate-x-1/2 pt-1
                            w-56 rounded-xl
                            bg-black/70 backdrop-blur-xl
                            border border-white/10
                            opacity-0 invisible scale-95
                            "
                    >
                            <a href="virtual-museum.html" class="block px-4 py-3 hover:bg-white/10 hover:rounded-xl">
                                3D Virtual Museum
                            </a>
                            <a href="collections.html" class="block px-4 py-3 hover:bg-white/10">
                                Collections
                            </a>
                            <a href="achievement.html" class="block px-4 py-3 hover:bg-white/10">
                                My Achievement
                            </a>
                            <a href="events.html" class="block px-4 py-3 hover:bg-white/10 hover:rounded-xl">
                                Events
                            </a>
                    </div>
                </div>
                <a href="visit-us.html">Visit Us</a>
            </div>
        </nav>
    </header>


    <section class="flex flex-col justify-center items-center gap-10 px-4 pt-24 pb-10 sm:pt-28">

    <div class="w-full md:w-[60%] lg:w-[40%] flex flex-col items-center">
        <h1 class="mt-4 sm:mt-8 md:mt-17 lg:mt-0 lg:text-7xl md:text-8xl p-4 sm:p-6 md:p-8 serif">Book Your Visit</h1>
        <form class="flex flex-col border-white/10 border-2 rounded-xl w-full md:w-[800px] lg:w-full px-4 sm:px-5 pt-5 mb-2 bg-black">
            <label class="p-3 py-2 text-4xl md:text-3xl lg:text-xl text-white/60 underline md:mb-4 lg:mb-0">Visit Date</label>
            <input class="border-2 rounded-xl border-white/30 p-3 mb-4 text-white text-2xl lg:text-base bg-[repeating-linear-gradient(45deg,rgba(255,255,255,0.05)_0px,rgba(255,255,255,0.05)_1px,transparent_1px,transparent_12px)] bg-white/5" type="date" min="2026-06-07" max="2026-12-31">

            <label class="p-3 py-2 text-4xl md:text-3xl lg:text-xl text-white/60 underline md:mb-4 lg:mb-0">Time Slot</label>
            <input class="border-2 rounded-xl border-white/30 p-3 mb-4 text-white text-2xl lg:text-base bg-[repeating-linear-gradient(45deg,rgba(255,255,255,0.05)_0px,rgba(255,255,255,0.05)_1px,transparent_1px,transparent_12px)] bg-white/5" type="time">

            <label class="p-3 py-2 text-4xl md:text-3xl lg:text-xl text-white/60 underline md:mb-4 lg:mb-0">Number of Exhibits</label>
            <input class="border-2 rounded-xl border-white/30 p-3 mb-4 text-white text-2xl lg:text-base bg-[repeating-linear-gradient(45deg,rgba(255,255,255,0.05)_0px,rgba(255,255,255,0.05)_1px,transparent_1px,transparent_12px)] bg-white/5" id='exhibits' type="number" min="1" max="4" placeholder="1-4">

            <label class="p-3 py-2 text-4xl md:text-3xl lg:text-xl text-white/60 underline md:mb-4 lg:mb-0">Age</label>
            <input class="border-2 rounded-xl border-white/30 p-3 mb-4 text-white text-2xl lg:text-base bg-[repeating-linear-gradient(45deg,rgba(255,255,255,0.05)_0px,rgba(255,255,255,0.05)_1px,transparent_1px,transparent_12px)] bg-white/5" id='ageGroup' type="number" min="10" max="120" placeholder="Enter age">

            <p id='price' class="my-5 p-3 py-2 text-green-400 mx-auto text-6xl lg:m-0 lg:mx-auto lg:text-3xl underline">Total: -</p>

            <div class="flex flex-wrap justify-center sm:justify-between gap-4 p-6 sm:p-10 sm:pt-5">
                <button class="text-2xl lg:text-sm border-2 rounded-xl bg-green-400/10 text-green-400 hover:bg-green-400/20 shadow-md hover:shadow-lg shadow-green-200/20 w-full sm:w-[30%] h-20 lg:h-10 cursor-pointer">Place Order!</button>
                <a href="visit-us.html#ticketdiv" class="text-2xl lg:text-sm border-2 rounded-xl bg-white/10 text-white-400 hover:bg-white/20 shadow-md hover:shadow-lg shadow-white/20 w-full sm:w-[30%] h-20 lg:h-10 flex items-center justify-center cursor-pointer">View Prices</a>
                <button class="text-2xl lg:text-sm border-2 rounded-xl bg-red-400/10 text-red-400 hover:bg-red-400/20 shadow-md hover:shadow-lg shadow-red-200/20 w-full sm:w-[30%] h-20 lg:h-10 cursor-pointer">Reset</button>
            </div>
        </form>
    </div>

    </section>
</body>

</html>
