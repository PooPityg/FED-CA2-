<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/output.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../Script/script.js" defer></script>
</head>
<body>
<header class="fixed top-0 w-full z-50 px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 backdrop-blur-lg bg-olive-900/60">
    <nav class="grid grid-cols-3 items-center font-instrument-sans text-neutral-100 py-3">

        <!-- Left -->
        <div class="flex justify-around">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>

        <!-- Center -->
        <a href="index.html" class="justify-self-center">
            <div class="flex flex-col items-center">
                <p class="bg-red-400">VIM</p>
                <p class="font-instrument-serif text-3xl">
                    CARPE DIEM
                </p>
            </div>
        </a>

        <!-- Right -->
        <div class="flex justify-around">
            <a href="explore.html">Explore</a>
            <a href="connect.html">Connect</a>
        </div>

    </nav>
</header>
    <main>
        <section id="hero" class="relative h-screen">
            <img
                src="../Assets/museum-hero.png"
                class="absolute inset-0 w-full h-full object-cover"
                alt="Museum hero"
            >

            <div class="absolute inset-0 text-white flex flex-col items-center justify-center z-20 px-3">
                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-semibold font-instrument-serif mb-1">Seize the Day.</h1>
                <p class="max-w-sm md:max-w-lg text-xs sm:text-base text-center font-instrument-sans">To put to rout all that was not life; and not, when I had come to die, discover that I had not lived.</p>
                <div class="flex flex-row justify-between gap-4 mt-2">
                    <a id="enterMuseumBtn" href="museum.html" class="cursor-pointer font-instrument-serif border-1 border-olive-900 bg-white/80 text-olive-900 backdrop-blur-lg">Enter the Museum</a>
                    <a id="browseCollectionBtn" class="cursor-pointer font-instrument-serif border-1 bg-olive-900/30 border-olive-900 text-white backdrop-blur-lg">Browse Collection</a>
                </div>
            </div>
        </section>

        <section class="relative ">
            <canvas
                id="hero-canvas"
                class="fixed inset-0 w-full h-full -z-10"
            ></canvas>
        </section>

        <section class="font-instrument-serif flex items-center justify-center h-screen">
            <h1>Virtual Interactive Museum</h1>
            <a href="museum.html">Enter Museum</a>
        </section>
        <section class="font-instrument-serif flex items-center justify-center h-screen">
            <h1 id="test">Virtual Interactive Museum</h1>
            <a href="museum.html">Enter Museum</a>
        </section>
    </main>
</body>
</html>
