<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="../Script/quiz.js" defer></script>
    <script src="../Script/main.js" defer></script>
    <link rel="stylesheet" href="../CSS/pages/progressbar.css">
    <link rel="stylesheet" href="../CSS/output.css">
</head>
<body class="min-h-screen">
    <header id="navbar" class="fixed top-0 w-full z-50 transition-transform duration-300 ease-in-out">
        <nav class="grid grid-cols-3 items-center font-instrument-sans text-neutral-100 py-3 px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 backdrop-blur-lg bg-olive-900/30">

            <!-- Left -->
            <div class="flex justify-around">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>

            <!-- Center -->
            <a href="index.html" class="justify-self-center" id="brand">
                <div class="flex flex-col items-center">
                    <span class="bg-red-400">VIM</span>
                    <span class="font-instrument-serif text-xl sm:text-2xl md:text-3xl mt-1">
                        CARPE DIEM
                    </span>
                </div>
            </a>

            <!-- Right -->
            <div class="flex justify-around">
                <div class="relative" id="exploreMenu">
                    <button
                        id="exploreBtn"
                        class="flex items-center gap-1 cursor-pointer"
                    >
                        Explore
                        <span id="exploreArrow">▾</span>
                    </button>
                    <div
                        id="exploreDropdown"
                        class="absolute top-full right-0 mt-2 w-56 rounded-xl bg-black/90 translate-x-1/2
                                opacity-0 invisible translate-y-2
                                transition-all duration-200 ease-out"
                    >
                        <a href="virtual-museum.html" class="block px-4 py-3 text-sm hover:bg-white/10 transition-colors rounded-t-xl">
                            <span class="block font-medium">3D Virtual Museum</span>
                            <span class="block text-xs text-neutral-400 mt-0.5">Walk the immersive halls</span>
                        </a>
                        <a href="collections.html" class="block px-4 py-3 text-sm hover:bg-white/10 transition-colors" role="menuitem">
                            <span class="block font-medium">Collections</span>
                            <span class="block text-xs text-neutral-400 mt-0.5">Browse artifacts by era</span>
                        </a>
                        <a href="achievement.html" class="block px-4 py-3 text-sm hover:bg-white/10 transition-colors" role="menuitem">
                            <span class="block font-medium">My Achievement</span>
                            <span class="block text-xs text-neutral-400 mt-0.5">View your passport & badges</span>
                        </a>
                        <a href="quiz.html" class="block px-4 py-3 text-sm hover:bg-white/10 transition-colors rounded-b-xl" role="menuitem">
                            <span class="block font-medium">Quiz</span>
                            <span class="block text-xs text-neutral-400 mt-0.5">Test your knowledge</span>
                        </a>
                    </div>
                </div>
                <a href="visit-us.html">Visit Us</a>
            </div>
        </nav>
    </header>
    <main class="flex justify-center items-center px-6 pt-32 pb-16 ">
        <header class="max-w-xl w-full" id="stage">
            <!-- Intro-->
            <div id="proggres"></div>
            <div class="border text-center rounded-sm px-8 pt-10 pb-8" id="intro">
                <div>Carpe Diem Musuem</div>
                <h1>Title</h1><!--add a title for the quiz-->
                <p>Context</p><!--Add Context paragraph for User-->
                <button class="cursor-pointer" onclick="toQuiz()">Begin Quiz</button>
            </div>
            <!--quiz-->
            <div class= "hidden" id="quiz">
                <div id="log">
                    <span id="lognum"></span>
                    <span id="logscore"></span>
                </div>
                <h1 id="question"></h1>
                <div id="opions"></div>
                <div class= "hidden" id="qcontext"></div>
                <div class= "hidden" id="action">
                    <button id="nextBtn" class="" onclick="nextQues()"></button>             
                </div>
            </div>
            <!--results-->
            <div class= "hidden" id="end">
                <div>Quiz completed</div>
                <h1>Your Result</h1>    
                <div id="finalscore">0<span> /10</span></div>
                <div id="resultline"></div>
                <div id="b_row">
                    <button id="visitBtn">Plan your visit</button>
                    <button id="retakeBtn" onclick="restartQuiz()">Retake the quiz</button>
                </div>
            </div>
        </header>
    </main>
</body>
</html>
