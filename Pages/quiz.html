<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="../Script/quiz.js" defer></script>
    <script src="../Script/main.js" defer></script>
    <link rel="stylesheet" href="../CSS/pages/progressbar.css">
    <link rel="stylesheet" href="../CSS/output.css">
</head>
<body class="min-h-screen">
    <header class="fixed top-0 w-full z-50 px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 backdrop-blur-lg bg-olive-900/30">
        <nav class="grid grid-cols-3 items-center font-instrument-sans text-neutral-100 py-3">

            <!-- Left -->
            <div class="flex justify-around">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>

            <!-- Center -->
            <a href="index.html" class="justify-self-center" id="brand">
                <div class="flex flex-col items-center">
                    <p class="bg-red-400">VIM</p>
                    <p class="font-instrument-serif text-3xl">
                        CARPE DIEM
                    </p>
                </div>
            </a>

            <!-- Right -->
            <div class="flex justify-around">
                <div class="relative" id="exploreMenu">
                    <button
                        id="exploreBtn"
                        class="flex items-center gap-1 cursor-pointer"
                    >
                        Explore
                        <span id="exploreArrow">▾</span>
                    </button>
                    <div
                        id="exploreDropdown"
                        class="absolute top-full left-1/2 -translate-x-1/2 pt-1
                            w-56 rounded-xl
                            bg-black/70 backdrop-blur-xl
                            border border-white/10
                            opacity-0 invisible scale-95
                            "
                    >
                            <a href="virtual-museum.html" class="block px-4 py-3 hover:bg-white/10">
                                3D Virtual Museum
                            </a>
                            <a href="collections.html" class="block px-4 py-3 hover:bg-white/10">
                                Collections
                            </a>
                            <a href="achievement.html" class="block px-4 py-3 hover:bg-white/10">
                                My Achievement
                            </a>
                            <a href="events.html" class="block px-4 py-3 hover:bg-white/10">
                                Events
                            </a>
                    </div>
                </div>
                <a href="visit-us.html">Visit Us</a>
            </div>
        </nav>
    </header>
    <main class="flex justify-center items-center px-6 pt-16 pb-16 min-h-screen ">
        <header class="max-w-xl w-full" id="stage">
            <!-- Intro-->
            <div id="proggres" class="flex items-center justify-center gap-1.5 mb-8 px-1"></div>
            <section class="bg-parchment text-inkText rounded-sm border border-black/5 card-shadow px-9 pt-10 pb-8 text-center font-instrument-serif" id="intro">
                <p class="tracking-widest uppercase mb-8">Carpe Diem Musuem</p>
                <h1 class="text-4xl leading-tight mb-3">Title</h1><!--add a title for the quiz-->
                <p class="leading-relaxed mb-6 max-w-mb mx-auto ">Context</p><!--Add Context paragraph for User-->
                <button class="font-mono text-xs tracking-widest uppercase px-6 py-3 rounded-sm hover:bg-[#2A3348] transition cursor-pointer" onclick="toQuiz()">Begin Quiz</button><!--cursor-pointer transition rounded-sm tracking-widest uppercase bg-pink-300 px-6 py-3 hover:bg-red-500-->
            </section>
            <!--quiz-->
            <section class= "hidden rounded-sm border border-black/5 card-shadow px-9 pt-10 pb-8" id="quiz">
                <div class="flex justify-between mb-3 pb-6 border-b border-black/10 tracking-widest uppercase text-[15px] font-instrument-serif" id="log">
                    <span id="lognum"></span>
                    <span id="logscore"></span>
                </div>
                <h1 class="font-instrument-serif text-2xl leading-snug mb-6" id="question"></h1>
                <div class="flex flex-col gap-2.5 font-instrument-serif text-2xl tracking-widest" id="opions"></div>
                <div class= "hidden font-instrument-serif tracking-widest" id="qcontext"></div>
                <div class= "hidden font-instrument-serif tracking-wide" id="action">
                    <button id="nextBtn" class="rounded-sm hover:bg-[#FF13F0] transition cursor-pointer" onclick="nextQues()"></button>             
                </div>
            </section>
            <!--results-->
            <section class= "hidden rounded-sm border border-black card-shadow px-9 pt-10 pb-8 text-center font-instrument-serif" id="end">
                <p class="text-[11px] mb-3 uppercase tracking-widest ">Quiz completed</p>
                <h1 class="text-3xl mb-2">Your Result</h1>    
                <div class="leading-none text-6xl my-2 font-bold " id="finalscore">0<span> /10</span></div>
                <div class="text-lg leading-none italic " id="resultline"></div>
                <div class="flex gap-3 flex-wrap justify-center my-3" id="b_row">
                    <button class="rounded-sm border-black border px-3 " id="visitBtn" onclick="window.location.href='visit-us.html';" >Plan your visit</button>
                    <button class="rounded-sm border-black border px-3 " id="retakeBtn" onclick="restartQuiz()">Retake the quiz</button>
                </div>
            </section>
        </header>
    </main>
</body>
</html>
