<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src=""></script>
    <script src="../Script/main.js" defer></script>
    <link rel="stylesheet" href="../CSS/output.css">
</head>
<body>
    <header class="sticky top-0 w-full z-50 px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 backdrop-blur-lg bg-olive-900/30">
        <nav class="grid grid-cols-3 items-center font-instrument-sans text-neutral-100 py-3">

            <!-- Left -->
            <div class="flex justify-around">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </div>

            <!-- Center -->
            <a href="index.html" class="justify-self-center" id="brand">
                <div class="flex flex-col items-center">
                    <p class="bg-red-400">VIM</p>
                    <p class="font-instrument-serif text-3xl">
                        CARPE DIEM
                    </p>
                </div>
            </a>

            <!-- Right -->
            <div class="flex justify-around">
                <div class="relative" id="exploreMenu">
                    <button
                        id="exploreBtn"
                        class="flex items-center gap-1 cursor-pointer"
                    >
                        Explore
                        <span id="exploreArrow">▾</span>
                    </button>
                    <div
                        id="exploreDropdown"
                        class="absolute top-full left-1/2 -translate-x-1/2 pt-1
                            w-56 rounded-xl
                            bg-black/70 backdrop-blur-xl
                            border border-white/10
                            opacity-0 invisible scale-95
                            "
                    >
                            <a href="virtual-museum.html" class="block px-4 py-3 hover:bg-white/10">
                                3D Virtual Museum
                            </a>
                            <a href="collections.html" class="block px-4 py-3 hover:bg-white/10">
                                Collections
                            </a>
                            <a href="achievement.html" class="block px-4 py-3 hover:bg-white/10">
                                My Achievement
                            </a>
                            <a href="events.html" class="block px-4 py-3 hover:bg-white/10">
                                Events
                            </a>
                    </div>
                </div>
                <a href="visit-us.html">Visit Us</a>
            </div>
        </nav>
    </header>
    <main>
        <header id="stage">
            <!-- Intro-->
            <div id="proggres"></div>
            <div id="intro">
                <div>Carpe Diem Musuem</div>
                <h1>Title</h1><!--add a title for the quiz-->
                <p>Context</p><!--Add Context paragraph for User-->
                <button class="cursor-pointer" onclick="">Begin Quiz</button>
            </div>
            <!--quiz-->
            <div class="invisible" id="quiz">
                <div id="log">
                    <span id="lognum"></span>
                    <span id="logscore"></span>
                </div>
                <h1 id="question"></h1>
                <div id="opions"></div>
                <div class="invisible" id="qcontext"></div>
                <div class="invisible" id="action">
                    <button id="nextBtn" class="" onclick=""></button>             
                </div>
            </div>
            <!--results-->
            <div class="invisible" id="end">
                <div>Quiz completed</div>
                <h1>Your Result</h1>    
                <div id="finalscore">0<span> /10</span></div>
                <div id="resultline"></div>
                <div id="b_row">
                    <button id="visitBtn">Plan your visit</button>
                    <button id="retakeBtn" onclick="">Retake the quiz</button>
                </div>
            </div>
        </header>
    </main>
</body>
</html>
