<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src=""></script>
    <link rel="stylesheet" href="../CSS/output.css">
</head>
<body>
    <header class="fixed top-0 w-full z-50 px-4 sm:px-6 md:px-8 lg:px-12 xl:px-16 py-4 mix-blend-difference text-neutral-200 bg-neutral-500/50 backdrop-blur-lg rounded-md">
        <nav class="flex justify-between items-center max-container font-instrument-sans">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="home.html">
                <div class="flex flex-col justify-center items-center">
                    <p class="bg-red-400 inline text-center">VIM</p>
                    <p class="font-instrument-serif sm:text-2xl lg:text-3xl">CARPE DIEM</p>
                </div> 
            </a>
            <a href="explore.html">Explore</a>
            <a href="connect.html">Connect</a>
        </nav>
    </header>
    <main>
        <header id="stage">
            <!-- Intro-->
            <div id="proggres"></div>
            <div id="intro">
                <div>Carpe Diem Musuem</div>
                <h1>Title</h1><!--add a title for the quiz-->
                <p>Context</p><!--Add Context paragraph for User-->
                <button  onclick="">Begin Quiz</button>
            </div>
            <!--quiz-->
            <div class="invisible" id="quiz">
                <div id="log">
                    <span id="lognum">QUESTION 1/10</span>
                    <span id="logscore">SCORE 0</span>
                </div>
                <h1 id="question"></h1>
                <div id="opions"></div>
                <div class="invisible" id="qcontext"></div>
                <div class="invisible" id="action">
                    <button id="nextBtn" class="" onclick="">Next question</button>             
                </div>
            </div>
            <!--results-->
            <div class="invisible" id="end">
                <div>Quiz completed</div>
                <h1>Your Result</h1>    
                <div id="finalscore">0<span> /10</span></div>
                <div id="resultline"></div>
                <div id="b_row">
                    <button id="visitBtn">Plan your visit</button>
                    <button id="retakeBtn" onclick="">Retake the quiz</button>
                </div>
            </div>
        </header>
    </main>
</body>
</html>
