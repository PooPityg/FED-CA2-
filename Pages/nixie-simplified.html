<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nixie Tube Chronometer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        'instrument-serif': ['"Instrument Serif"', 'serif'],
        'instrument-sans': ['"Instrument Sans"', 'sans-serif'],
        'mono': ['"Intel One Mono"', 'monospace'],
        'caesar': ['"Caesar Dressing"', 'cursive'],
      },
      colors: {
        nixie: {
          base: '#ff8c20',
          dim: 'rgba(255, 140, 40, 0.12)',
          glow: 'rgba(255, 160, 60, 1)',
          amber: '#ffc864',
        }
      }
    }
  }
}
</script>
<style>
/* ===== CRT NOISE + OVERLAY ===== */
#noiseCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 200; opacity: 0.14; mix-blend-mode: screen;
}
.crt-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 3px);
  background-size: 100% 4px;
  animation: scanline-drift 0.08s linear infinite;
}
.crt-overlay::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
}
.crt-overlay::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(255, 140, 40, 0.018);
  animation: crt-flicker 0.1s steps(2) infinite;
}
@keyframes scanline-drift { 0% { background-position: 0 0; } 100% { background-position: 0 4px; } }
@keyframes crt-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }

/* ===== SCREEN SHAKE ===== */
@keyframes screen-shake {
  0% { transform: translate(0,0) rotate(0deg); }
  10% { transform: translate(-3px,2px) rotate(-0.2deg); }
  20% { transform: translate(3px,-2px) rotate(0.2deg); }
  30% { transform: translate(-2px,3px) rotate(-0.1deg); }
  40% { transform: translate(2px,-3px) rotate(0.1deg); }
  50% { transform: translate(-4px,1px) rotate(-0.15deg); }
  60% { transform: translate(4px,-1px) rotate(0.15deg); }
  70% { transform: translate(-1px,4px) rotate(-0.05deg); }
  80% { transform: translate(1px,-4px) rotate(0.05deg); }
  90% { transform: translate(-2px,2px) rotate(-0.1deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}
.shaking { animation: screen-shake 0.12s linear infinite; }

/* ===== DUST ===== */
.particle {
  position: absolute; width: 2px; height: 2px;
  background: rgba(255, 160, 60, 0.25); border-radius: 50%;
  animation: drift 18s linear infinite;
}
@keyframes drift {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10%, 90% { opacity: 0.5; }
  100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
}

/* ===== DIGIT EFFECTS ===== */
.digit {
  transition: opacity 0.04s;
  text-shadow: 0 0 10px rgba(255,140,40,0.8), 0 0 30px rgba(255,100,20,0.6), 0 0 60px rgba(255,80,10,0.4), 0 0 100px rgba(255,60,0,0.2);
}
.digit.active {
  opacity: 1; /* ← this was missing */
  text-shadow: 0 0 10px rgba(255,160,60,1), 0 0 30px rgba(255,120,30,0.9), 0 0 60px rgba(255,100,20,0.7), 0 0 100px rgba(255,80,10,0.4), 0 0 150px rgba(255,60,0,0.2);
}
@keyframes nixie-flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.88; } 52% { opacity: 1; } 85% { opacity: 0.92; } 87% { opacity: 1; } }
.digit.active.flicker { animation: nixie-flicker 0.12s ease-in-out; }
@keyframes glow-pulse {
  0%, 100% { text-shadow: 0 0 10px rgba(255,160,60,1), 0 0 30px rgba(255,120,30,0.9), 0 0 60px rgba(255,100,20,0.7); }
  50% { text-shadow: 0 0 15px rgba(255,180,80,1), 0 0 40px rgba(255,140,50,1), 0 0 80px rgba(255,120,30,0.9), 0 0 120px rgba(255,100,20,0.5); }
}
.digit.settled { animation: glow-pulse 3s ease-in-out infinite; }

/* ===== META INFO TRANSITIONS ===== */
.meta-divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,140,40,0.4), transparent);
  margin: 12px auto; opacity: 0; transform: scaleX(0); transition: all 0.6s ease 0.3s;
}
.meta-visible .meta-divider { opacity: 1; transform: scaleX(1); }

/* ===== GLASS REFLECTION ===== */
.tube-glass::before {
  content: ''; position: absolute; top: 8%; left: 15%; width: 25%; height: 40%;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 70%);
  filter: blur(2px);
}
</style>
</head>
<body class="bg-neutral-950 h-screen grid place-items-center overflow-hidden font-instrument-sans selection:bg-orange-500/30">

<!-- CRT Noise -->
<canvas id="noiseCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-[200] opacity-[0.14] mix-blend-screen"></canvas>

<!-- Ambient Glow -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-[radial-gradient(ellipse_at_center,rgba(255,100,20,0.04)_0%,transparent_70%)] pointer-events-none z-[1]"></div>

<!-- CRT Overlay -->
<div class="crt-overlay fixed inset-0 pointer-events-none z-[100]"></div>

<!-- Dust -->
<div id="dust" class="fixed inset-0 pointer-events-none z-[5]"></div>

<!-- Main Container -->
<div id="nixieContainer" class="relative flex flex-col items-center px-16 pt-14 pb-10 bg-gradient-to-b from-[#0a0a0a] to-[#050505] rounded-[20px] border border-orange-500/[0.08] shadow-[inset_0_1px_0_rgba(255,255,255,0.03),0_40px_80px_rgba(0,0,0,0.8),0_0_120px_rgba(255,100,20,0.04)] cursor-pointer group">

  <!-- Tubes Row -->
  <div id="tubesRow" class="flex gap-6"></div>

  <!-- Meta Info -->
  <div id="metaInfo" class="mt-12 text-center opacity-0 translate-y-5 transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] pointer-events-none">
    <div id="metaEra" class="font-instrument-serif text-lg font-semibold text-amber-300 tracking-[0.15em] uppercase mb-2 drop-shadow-[0_0_20px_rgba(255,200,100,0.3)]">Old Kingdom</div>
    <div id="metaPeriod" class="font-mono text-sm text-orange-500 tracking-[0.3em] mb-3 opacity-80">2560 BCE</div>
    <div class="meta-divider"></div>
    <div id="metaPlace" class="font-instrument-serif text-sm text-neutral-500 tracking-[0.2em] uppercase">Giza, Egypt</div>
  </div>

  <!-- Wires -->
  <div class="absolute -bottom-10 left-0 right-0 h-[30px] flex justify-around px-10">
    <div class="w-0.5 h-full bg-gradient-to-b from-neutral-700 to-neutral-900 opacity-60"></div>
    <div class="w-0.5 h-full bg-gradient-to-b from-neutral-700 to-neutral-900 opacity-60"></div>
    <div class="w-0.5 h-full bg-gradient-to-b from-neutral-700 to-neutral-900 opacity-60"></div>
    <div class="w-0.5 h-full bg-gradient-to-b from-neutral-700 to-neutral-900 opacity-60"></div>
  </div>

  <!-- Label -->
  <div class="absolute -bottom-[70px] left-1/2 -translate-x-1/2 text-[10px] tracking-[0.4em] uppercase text-neutral-700 whitespace-nowrap font-caesar">Chronometer Model VII</div>
</div>

<script>
const TUBE_COUNT = 4;
const DIGIT_HEIGHT = 100;

// ---------- Build tubes + digit strips ----------
const tubesRow = document.getElementById('tubesRow');
const digitsHTML = Array.from({ length: 10 }, (_, n) => 
  `<div class="digit h-[100px] flex items-center justify-center text-7xl text-orange-500 opacity-[0.12] font-mono">${n}</div>`
).join('');
const pinsHTML = '<div class="w-[3px] h-3 bg-gradient-to-b from-neutral-600 to-neutral-800 rounded-b-sm"></div>'.repeat(5);

for (let i = 0; i < TUBE_COUNT; i++) {
  const tube = document.createElement('div');
  tube.className = 'relative w-24 h-40 flex items-center justify-center';
  tube.id = 'tube-' + i;
  tube.innerHTML = `
    <div class="tube-glass absolute inset-0 rounded-[50%/20%] border border-orange-500/[0.12] shadow-[inset_0_0_30px_rgba(255,100,20,0.05),inset_0_0_60px_rgba(255,80,10,0.02),0_0_40px_rgba(255,100,20,0.08)] overflow-hidden bg-[radial-gradient(ellipse_80%_50%_at_50%_20%,rgba(255,200,120,0.08)_0%,transparent_60%),radial-gradient(ellipse_60%_40%_at_30%_30%,rgba(255,255,255,0.04)_0%,transparent_50%),linear-gradient(180deg,rgba(255,255,255,0.03)_0%,transparent_30%,transparent_70%,rgba(255,255,255,0.02)_100%)]"></div>
    <div class="relative w-16 h-24 overflow-hidden z-10">
      <div class="absolute top-0 left-0 w-full text-center transition-transform duration-[60ms] ease-linear" id="strip-${i}">${digitsHTML}</div>
    </div>
    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-[70%] h-5 bg-gradient-to-b from-neutral-900 via-neutral-800 to-[#0d0d0d] rounded border border-white/[0.06] shadow-[0_4px_12px_rgba(0,0,0,0.6)]">
      <div class="absolute top-0.5 left-[10%] right-[10%] h-0.5 bg-gradient-to-r from-transparent via-orange-500/30 to-transparent"></div>
    </div>
    <div class="absolute -bottom-[22px] left-1/2 -translate-x-1/2 flex gap-2">${pinsHTML}</div>`;
  tubesRow.appendChild(tube);
}

// ---------- CRT noise ----------
const noiseCanvas = document.getElementById('noiseCanvas');
const noiseCtx = noiseCanvas.getContext('2d');
function resizeNoise() {
  noiseCanvas.width = window.innerWidth;
  noiseCanvas.height = window.innerHeight;
}
resizeNoise();
window.addEventListener('resize', resizeNoise);

function drawNoise() {
  const { width: w, height: h } = noiseCanvas;
  const idata = noiseCtx.createImageData(w, h);
  const buffer = new Uint32Array(idata.data.buffer);
  for (let i = 0; i < buffer.length; i++) {
    const v = (Math.random() * 255) | 0;
    buffer[i] = (255 << 24) | (v << 16) | (v << 8) | v;
  }
  noiseCtx.putImageData(idata, 0, 0);
  requestAnimationFrame(drawNoise);
}
drawNoise();

// ---------- Dust particles ----------
const dustContainer = document.getElementById('dust');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDelay = Math.random() * 20 + 's';
  p.style.animationDuration = (15 + Math.random() * 15) + 's';
  dustContainer.appendChild(p);
}

// ---------- Digit display helpers ----------
function setDigit(tubeIndex, value, flickerChance = 0, settled = false) {
  const strip = document.getElementById('strip-' + tubeIndex);
  strip.style.transform = `translateY(-${value * DIGIT_HEIGHT}px)`;
  strip.querySelectorAll('.digit').forEach((d, i) => {
    d.classList.remove('active', 'flicker', 'settled');
    if (i === value) {
      d.classList.add('active');
      if (settled) d.classList.add('settled');
      if (flickerChance && Math.random() > 1 - flickerChance) d.classList.add('flicker');
    }
  });
}

function smoothSettle(tubeIndex, value, onDone) {
  const strip = document.getElementById('strip-' + tubeIndex);
  strip.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
  strip.style.transform = `translateY(-${value * DIGIT_HEIGHT}px)`;
  setTimeout(() => {
    setDigit(tubeIndex, value, 0, true);
    strip.style.transition = 'transform 0.06s linear';
    onDone?.();
  }, 520);
}

// ---------- Roll-to-year animation ----------
const container = document.getElementById('nixieContainer');
const metaInfo = document.getElementById('metaInfo');

function rollToYear(targetYear, duration, era, period, place) {
  const targetDigits = String(targetYear).padStart(4, '0').split('').map(Number);
  const digitStates = Array.from({ length: TUBE_COUNT }, () => ({
    settleAt: 0.35 + Math.random() * 0.45,
    speed: 0.8 + Math.random() * 0.6,
    cycles: 3 + Math.floor(Math.random() * 4),
    settled: false
  }));

  let settledCount = 0;
  const startTime = performance.now();
  metaInfo.classList.remove('meta-visible');
  metaInfo.classList.remove('opacity-100', 'translate-y-0');
  metaInfo.classList.add('opacity-0', 'translate-y-5');
  container.classList.add('shaking');

  function revealMeta() {
    document.getElementById('metaEra').textContent = era;
    document.getElementById('metaPeriod').textContent = period;
    document.getElementById('metaPlace').textContent = place;
    setTimeout(() => {
      metaInfo.classList.add('meta-visible');
      metaInfo.classList.remove('opacity-0', 'translate-y-5');
      metaInfo.classList.add('opacity-100', 'translate-y-0');
    }, 300);
  }

  function tick(now) {
    const progress = Math.min((now - startTime) / duration, 1);

    digitStates.forEach((state, i) => {
      if (state.settled) return;

      if (progress < state.settleAt) {
        const rollProgress = progress / state.settleAt;
        const eased = 1 - Math.pow(1 - rollProgress, 2);
        const value = Math.floor((eased * state.cycles * 10 * state.speed) % 10);
        setDigit(i, value, 0.4);
      } else {
        state.settled = true;
        smoothSettle(i, targetDigits[i], () => {
          if (++settledCount === TUBE_COUNT) {
            container.classList.remove('shaking');
            revealMeta();
          }
        });
      }
    });

    if (progress < 1) requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}

// ---------- Initial state ----------
[2, 0, 2, 6].forEach((v, i) => setDigit(i, v, 0, true));
metaInfo.classList.add('meta-visible');
metaInfo.classList.remove('opacity-0', 'translate-y-5');
metaInfo.classList.add('opacity-100', 'translate-y-0');

// ---------- Destinations ----------
const DESTINATIONS = [
  { year: 2560, era: 'Old Kingdom', period: '2560 BCE', place: 'Giza, Egypt' },
  { year: 220, era: 'Qin Dynasty', period: '220 BCE', place: "Xi'an, China" },
  { year: 1200, era: 'Ancestral Puebloan', period: '1200 CE', place: 'Colorado, USA' },
  { year: 1250, era: 'Rapa Nui Period', period: '1250 CE', place: 'Easter Island, Chile' },
  { year: 1492, era: 'Age of Discovery', period: '1492 CE', place: 'Palos, Spain' },
  { year: 1776, era: 'Enlightenment', period: '1776 CE', place: 'Philadelphia, USA' },
  { year: 1969, era: 'Space Age', period: '1969 CE', place: 'Cape Canaveral, USA' },
  { year: 1066, era: 'High Middle Ages', period: '1066 CE', place: 'Hastings, England' },
  { year: 476, era: 'Late Antiquity', period: '476 CE', place: 'Ravenna, Italy' }
];

container.addEventListener('click', () => {
  const d = DESTINATIONS[Math.floor(Math.random() * DESTINATIONS.length)];
  rollToYear(d.year, 2800, d.era, d.period, d.place);
});

// Auto-roll demo
setTimeout(() => rollToYear(2560, 2800, 'Old Kingdom', '2560 BCE', 'Giza, Egypt'), 1800);
</script>

</body>
</html>
